version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finally-app:test
    container_name: finally-app-test
    ports:
      - "8000:8000"
    environment:
      - LLM_MOCK=true
      - OPENROUTER_API_KEY=mock-openrouter-key-for-e2e
      - MASSIVE_API_KEY=
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  test-runner:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    container_name: finally-playwright-tests
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
      - CI=true
    volumes:
      - ..:/work
    working_dir: /work/test
    command: >
      sh -c "npm ci && npx playwright test"
